<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" font-family="'Times New Roman', 'Liberation Serif', 'STIX Two Text', Times, serif" role="img" aria-labelledby="t d">
  <title id="t">Three routes from material data to a flow stress equation</title>
  <desc id="d">From characterized material data, (a) the conventional method fits the constants of a physically based or empirical equation chosen in advance, such as Johnson-Cook; (b) the machine-learning method trains a neural network on the data, accurate inside the tested range but uncertain outside it; (c) this work screens the data, passes non-ideal data through an artificial neural network, and uses SVD or CP tensor decomposition to identify the flow stress equation from the low-rank structure of the data, in discrete or analytic form.</desc>
