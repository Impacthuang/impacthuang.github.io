<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Times New Roman', 'Liberation Serif', 'STIX Two Text', Times, serif" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a numerical simulation</title>
  <desc id="d">A numerical simulation combines (a) a discretized geometry: 1D bars, 2D triangles and quadrilaterals, 3D hexahedra, or meshless SPH particles; (b) the constitutive equation of the metal: elastic response by Hooke's law up to yield, then plastic flow governed by a flow stress equation that depends on plastic strain, strain rate and temperature, which sets the size of the von Mises yield surface, while the flow rule gives the direction of plastic flow; and (c) balance laws for mass, momentum and energy, into which the constitutive equation supplies the stress.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#B23A12"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#888"/></marker>
  </defs>
  <style>
    .hd  { font-size: 18px; fill: #111; }
    .lb  { font-size: 14px; fill: #333; }
    .cap { font-size: 13.5px; fill: #555; font-style: italic; }
    .m   { font-style: italic; }
    .ink { fill: none; stroke: #222; stroke-width: 1.2; }
    .thin{ fill: none; stroke: #555; stroke-width: .8; }
    .gr  { fill: none; stroke: #9a9a9a; stroke-width: 1; }
    .acc { fill: none; stroke: #B23A12; stroke-width: 2; }
    .A   { fill: #B23A12; }
  </style>

  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- panel rules -->
  <path d="M345,30 V500 M872,30 V500" stroke="#d6d2ca" stroke-width="1"/>

  <!-- ═════ (a) Geometric representation ═════ -->
  <text x="30" y="46" class="hd"><tspan font-weight="700">(a)</tspan> Geometric representation</text>

  <text x="30" y="88" class="lb">1D · bar</text>
  <path class="ink" d="M110,84 H310"/>
  <g fill="#222"><circle cx="110" cy="84" r="3"/><circle cx="160" cy="84" r="3"/><circle cx="210" cy="84" r="3"/><circle cx="260" cy="84" r="3"/><circle cx="310" cy="84" r="3"/></g>

  <text x="30" y="128" class="lb">2D · quadrilateral | triangle</text>
  <g class="thin">
    <rect x="40" y="142" width="270" height="96" fill="#faf8f4" stroke="#222" stroke-width="1.2"/>
    <path d="M67,142 V238 M94,142 V238 M121,142 V238 M148,142 V238 M175,142 V238 M202,142 V238 M229,142 V238 M256,142 V238 M283,142 V238"/>
    <path d="M40,166 H310 M40,190 H310 M40,214 H310"/>
    <path d="M175,166 L202,142 M175,190 L229,142 M175,214 L256,142 M175,238 L283,142 M202,238 L310,142 M229,238 L310,166 M256,238 L310,190 M283,238 L310,214"/>
  </g>

  <text x="30" y="284" class="lb">3D · hexahedron</text>
  <g class="ink" stroke-linejoin="round">
    <path d="M60,330 L120,330 L120,390 L60,390 Z"/>
    <path d="M60,330 L88,306 L148,306 L120,330 M148,306 L148,366 L120,390"/>
    <path d="M60,390 L88,366 L148,366 M88,366 L88,306" stroke-dasharray="3 3" stroke="#888"/>
  </g>
  <g fill="#222"><circle cx="60" cy="330" r="2.6"/><circle cx="120" cy="330" r="2.6"/><circle cx="120" cy="390" r="2.6"/><circle cx="60" cy="390" r="2.6"/><circle cx="88" cy="306" r="2.6"/><circle cx="148" cy="306" r="2.6"/><circle cx="148" cy="366" r="2.6"/><circle cx="88" cy="366" r="2.6" fill="#888"/></g>

  <text x="190" y="284" class="lb">meshless · SPH</text>
  <g fill="#fff" stroke="#222" stroke-width="1">
    <circle cx="200" cy="312" r="5"/><circle cx="214" cy="312" r="5"/><circle cx="228" cy="312" r="5"/><circle cx="242" cy="312" r="5"/><circle cx="256" cy="312" r="5"/><circle cx="270" cy="312" r="5"/><circle cx="284" cy="312" r="5"/><circle cx="298" cy="312" r="5"/>
    <circle cx="207" cy="324" r="5"/><circle cx="221" cy="324" r="5"/><circle cx="235" cy="324" r="5"/><circle cx="249" cy="324" r="5"/><circle cx="263" cy="324" r="5"/><circle cx="277" cy="324" r="5"/><circle cx="291" cy="324" r="5"/><circle cx="305" cy="324" r="5"/>
    <circle cx="200" cy="336" r="5"/><circle cx="214" cy="336" r="5"/><circle cx="228" cy="336" r="5"/><circle cx="242" cy="336" r="5"/><circle cx="256" cy="336" r="5"/><circle cx="270" cy="336" r="5"/><circle cx="284" cy="336" r="5"/><circle cx="298" cy="336" r="5"/>
    <circle cx="207" cy="348" r="5"/><circle cx="221" cy="348" r="5"/><circle cx="235" cy="348" r="5"/><circle cx="249" cy="348" r="5"/><circle cx="263" cy="348" r="5"/><circle cx="277" cy="348" r="5"/><circle cx="291" cy="348" r="5"/><circle cx="305" cy="348" r="5"/>
    <circle cx="200" cy="360" r="5"/><circle cx="214" cy="360" r="5"/><circle cx="228" cy="360" r="5"/><circle cx="242" cy="360" r="5"/><circle cx="256" cy="360" r="5"/><circle cx="270" cy="360" r="5"/><circle cx="284" cy="360" r="5"/><circle cx="298" cy="360" r="5"/>
    <circle cx="207" cy="372" r="5"/><circle cx="221" cy="372" r="5"/><circle cx="235" cy="372" r="5"/><circle cx="249" cy="372" r="5"/><circle cx="263" cy="372" r="5"/><circle cx="277" cy="372" r="5"/><circle cx="291" cy="372" r="5"/><circle cx="305" cy="372" r="5"/>
  </g>
  <circle cx="249" cy="348" r="5" fill="#222"/>
  <circle cx="249" cy="348" r="31" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
  <path class="thin" d="M249,348 L271,326"/>
  <rect x="270" y="309" width="11" height="15" fill="#fff"/><text x="271" y="321" class="lb m" font-size="14">h</text>

  <text x="30" y="440" class="cap">The domain is discretized; the balance laws</text>
  <text x="30" y="458" class="cap">in (c) are solved on these elements or particles.</text>

  <!-- ═════ (b) Constitutive equation ═════ -->
  <text x="365" y="46" class="hd"><tspan font-weight="700">(b)</tspan> Constitutive equation <tspan fill="#666">(metals)</tspan></text>

  <path class="ink" marker-end="url(#a)" d="M395,380 V112"/>
  <path class="ink" marker-end="url(#a)" d="M395,380 H612"/>
  <text x="380" y="118" class="lb m" font-size="16">σ</text>
  <text x="604" y="400" class="lb m" font-size="16">ε</text>

  <path class="ink" stroke-width="1.6" d="M395,380 L428,200"/>
  <path class="thin" d="M409,318 L432,318"/><text x="436" y="322" class="lb" font-size="13">elastic · <tspan class="m">σ = Eε</tspan></text>

  <path class="gr" stroke-width="1.4" d="M418.8,250 C450,232 520,222 595,216"/>
  <path class="gr" stroke-width="1.4" d="M423.4,225 C455,206 520,196 595,190"/>
  <path class="acc" d="M428,200 C460,180 520,170 595,163"/>
  <g fill="#222"><circle cx="418.8" cy="250" r="2.8"/><circle cx="423.4" cy="225" r="2.8"/></g>
  <circle cx="428" cy="200" r="3.2" class="A"/>
  <path d="M432,214 L446,232" class="thin"/>
  <text x="448" y="246" class="lb" font-size="13">yield</text>
  <path stroke="#888" stroke-width="1" fill="none" marker-end="url(#aG)" d="M565,232 L565,158"/>
  <g font-size="13" fill="#666"><text x="572" y="248" font-style="italic">ε</text><circle cx="576.5" cy="238" r="1.1"/><text x="582" y="248">↑ ,</text><text x="600" y="248" font-style="italic">T</text><text x="609" y="248">↓</text></g>

  <text x="402" y="424" class="lb" fill="#B23A12" font-weight="700">Flow stress equation</text>
  <g fill="#B23A12" font-size="15" font-style="italic">
    <text x="402" y="446">σ</text><text x="411" y="450" font-size="11">y</text>
    <text x="421" y="446" font-style="normal">=</text><text x="434" y="446">f</text><text x="442" y="446" font-style="normal">(</text>
    <text x="448" y="446">ε</text><text x="455" y="450" font-size="11">p</text><text x="461" y="446" font-style="normal">,</text>
    <text x="469" y="446">ε</text><circle cx="474" cy="434.5" r="1.2"/><text x="476" y="450" font-size="11">p</text><text x="482" y="446" font-style="normal">,</text>
    <text x="490" y="446">T</text><text x="499" y="446" font-style="normal">)</text>
  </g>
  <text x="402" y="468" class="cap">sets the size of the yield surface</text>

  <g class="gr" stroke-width=".9">
    <path d="M760,268 V170"/>
    <path d="M760,268 L675,317"/>
    <path d="M760,268 L845,317"/>
  </g>
  <text x="752" y="162" class="lb m" font-size="13" fill="#777">σ′<tspan font-size="10" dy="3">1</tspan></text>
  <text x="652" y="330" class="lb m" font-size="13" fill="#777">σ′<tspan font-size="10" dy="3">2</tspan></text>
  <text x="848" y="330" class="lb m" font-size="13" fill="#777">σ′<tspan font-size="10" dy="3">3</tspan></text>
  <circle cx="760" cy="268" r="64" class="ink" stroke-width="1.6"/>
  <circle cx="760" cy="268" r="82" fill="none" stroke="#B23A12" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path class="acc" stroke-width="1.4" marker-end="url(#aA)" d="M704.6,236 L690,227.6"/>
  <text x="626" y="214" class="lb" font-size="12.5" fill="#B23A12">hardening</text>
  <circle cx="815.4" cy="236" r="3" fill="#222"/>
  <path class="ink" stroke-width="1.4" marker-end="url(#a)" d="M815.4,236 L851,215.5"/>
  <text x="826" y="204" class="lb m" font-size="14">dε<tspan font-size="10" dy="-6">p</tspan></text>

  <text x="672" y="372" class="lb" font-weight="700">Plasticity model</text>
  <text x="672" y="394" class="lb" font-size="13.5">von Mises criterion · <tspan fill="#666">shape</tspan></text>
  <text x="672" y="414" class="lb" font-size="13.5">flow rule · <tspan fill="#666">direction of plastic flow</tspan></text>
  <text x="672" y="446" class="cap">π-plane: current (solid) and</text>
  <text x="672" y="464" class="cap">hardened (dashed) yield surface</text>

  <!-- ═════ (c) Physical principles ═════ -->
  <text x="892" y="46" class="hd"><tspan font-weight="700">(c)</tspan> Physical principles</text>

  <path d="M960,110 C990,82 1080,84 1110,104 C1140,124 1132,176 1102,190 C1068,206 990,204 962,186 C936,168 934,130 960,110 Z" fill="#faf8f4" stroke="#222" stroke-width="1.2"/>
  <text x="1028" y="152" class="lb m" font-size="17">Ω</text>
  <text x="1114" y="98" class="lb m" font-size="14">∂Ω</text>
  <path class="ink" marker-end="url(#a)" d="M1106,186 L1128,206"/>
  <text x="1132" y="220" class="lb m" font-size="14">n</text>
  <path class="thin" marker-end="url(#aG)" d="M914,146 L950,146"/>
  <path class="thin" marker-end="url(#aG)" d="M1124,150 L1160,150"/>
  <text x="900" y="136" class="lb" font-size="12" fill="#777">flux in</text>
  <text x="1130" y="172" class="lb" font-size="12" fill="#777">flux out</text>

  <text x="892" y="256" class="lb" font-size="12.5" fill="#777">mass</text>
  <text x="975" y="256" class="lb m" font-size="16">∂ρ/∂t + ∇·(ρv) = 0</text>
  <text x="892" y="294" class="lb" font-size="12.5" fill="#777">momentum</text>
  <text x="975" y="294" class="lb m" font-size="16">ρ Dv/Dt = ∇·<tspan fill="#B23A12" font-weight="700">σ</tspan> + ρ b</text>
  <text x="892" y="332" class="lb" font-size="12.5" fill="#777">energy</text>
  <text x="975" y="332" class="lb m" font-size="16">ρ De/Dt = <tspan fill="#B23A12" font-weight="700">σ</tspan> : D − ∇·q</text>
  <text x="892" y="372" class="lb" font-size="13" fill="#666">+ boundary and initial conditions,</text>
  <text x="892" y="390" class="lb" font-size="13" fill="#666">  closures such as an equation of state</text>

  <text x="892" y="440" class="cap">The stress σ in the balance laws</text>
  <text x="892" y="458" class="cap">is supplied by the constitutive equation (b).</text>


  <path d="M30,516 H1170" stroke="#d6d2ca" stroke-width="1"/>
  <text x="600" y="556" text-anchor="middle" font-size="17" fill="#222">Numerical simulation  =  discretized geometry <tspan font-weight="700">(a)</tspan>  +  <tspan fill="#B23A12">constitutive equation</tspan> <tspan font-weight="700" fill="#B23A12">(b)</tspan>  +  balance laws <tspan font-weight="700">(c)</tspan></text>
</svg>
